<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تحديث مِشكاة</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090a;color:#f1eadc;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;text-align:center;padding:24px}
    .card{max-width:420px;border:1px solid rgba(229,203,146,.25);border-radius:18px;padding:28px 22px;background:rgba(255,255,255,.03)}
    h1{margin:0 0 10px;font-size:24px;font-weight:500;color:#e5cb92}
    p{margin:8px 0;line-height:1.9;color:#c9c1b3}
    button{margin-top:18px;border:1px solid rgba(229,203,146,.45);background:transparent;color:#e5cb92;border-radius:999px;padding:10px 22px;font:inherit;cursor:pointer}
    .err{color:#ff9b9b}
  </style>
</head>
<body>
  <main class="card">
    <h1>تحديث مِشكاة</h1>
    <p id="status">جارٍ حذف النسخة القديمة من ذاكرة المتصفح...</p>
    <p>سيُعاد فتح الموقع بالنسخة الجديدة تلقائيًا.</p>
    <button id="open" hidden>افتح الموقع الآن</button>
  </main>
  <script>
    (async function () {
      const status = document.getElementById('status');
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
      } catch (error) { console.warn('SW reset failed', error); }
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
      } catch (error) {
        console.warn('Cache reset failed', error);
        status.textContent = 'تعذر حذف بعض الملفات القديمة. أغلق التبويب وأعد فتح الموقع.';
        status.className = 'err';
      }
      status.textContent = 'تم حذف النسخة القديمة. جارٍ فتح الموقع...';
      const button = document.getElementById('open');
      button.hidden = false;
      button.addEventListener('click', () => location.replace('./?fresh=' + Date.now()));
      setTimeout(() => location.replace('./?fresh=' + Date.now()), 900);
    })();
  </script>
</body>
</html>
